# Decap CMS settings for the blog editing panel at /admin
# Repo: github.com/iamkazirifat/KRR-Portfolio

backend:
  name: github
  repo: iamkazirifat/KRR-Portfolio
  branch: main
  base_url: https://portfolio-of-kazi.vercel.app
  auth_endpoint: api/auth
  commit_messages:
    create: 'Blog: create "{{slug}}"'
    update: 'Blog: update "{{slug}}"'
    delete: 'Blog: delete "{{slug}}"'
    uploadMedia: 'Upload image "{{path}}"'
    deleteMedia: 'Delete image "{{path}}"'

# Uncomment to edit on your own computer with `npx decap-server` (no login needed)
# local_backend: true

site_url: https://portfolio-of-kazi.vercel.app
display_url: https://portfolio-of-kazi.vercel.app
logo_url: /assets/headshot.jpg

media_folder: assets/uploads
public_folder: /assets/uploads

collections:
  - name: blog
    label: Blog posts
    label_singular: Blog post
    description: Every article on the site. Saving a post updates the live page in about a minute.
    folder: content/blog
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{title}}  ·  {{category}}"
    sortable_fields: [title, category, date]
    view_groups:
      - label: Category
        field: category
    fields:
      - { label: Title (H1), name: title, widget: string }
      - label: URL slug
        name: url_slug
        widget: string
        required: false
        hint: "The page address: /blog/your-slug.html. Lowercase letters, numbers and hyphens. Leave blank to use the file name."
        pattern: ['^$|^[a-z0-9]+(?:-[a-z0-9]+)*$', 'Use lowercase letters, numbers and hyphens only']
      - label: Category
        name: category
        widget: select
        options: ["Business Inspection BD", "10 Studio", "Blog"]
        default: "Blog"
        hint: "Decides which section of the Portfolio page lists this post."
      - { label: Byline note, name: byline, widget: string, required: false, hint: "Shown after your name, e.g. Written for 10 Studio, published under a different byline" }
      - { label: Publish date, name: date, widget: datetime, required: false, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: Order in portfolio list, name: order, widget: number, value_type: int, required: false, hint: "Lower numbers show first. Leave blank to sort by date." }
      - { label: Draft (hide from site), name: draft, widget: boolean, default: false }
      - { label: Featured image, name: featured_image, widget: image, required: false, choose_url: true }
      - { label: Featured image alt text, name: featured_image_alt, widget: string, required: false, hint: "Describe the image for screen readers and Google." }
      - { label: Show table of contents, name: show_toc, widget: boolean, default: true, hint: "Built from your H2 headings." }
      - label: Body
        name: body
        widget: markdown
        buttons: [bold, italic, link, heading-two, heading-three, quote, bulleted-list, numbered-list, code]
        editor_components: [image]
        modes: [rich_text, raw]
      - label: SEO
        name: seo
        widget: object
        collapsed: false
        fields:
          - { label: SEO title, name: title, widget: string, required: false, hint: "Aim for 30 to 60 characters. Falls back to the post title." }
          - { label: Meta description, name: description, widget: text, required: false, hint: "Aim for 120 to 160 characters." }
          - { label: Focus keyword, name: focus_keyword, widget: string, required: false, hint: "The main phrase you want this page to rank for. Used by the checks in the preview." }
      - label: Social sharing (Open Graph / X)
        name: social
        widget: object
        collapsed: true
        fields:
          - { label: Share title, name: title, widget: string, required: false, hint: "Falls back to the SEO title." }
          - { label: Share description, name: description, widget: text, required: false, hint: "Falls back to the meta description." }
          - { label: Share image, name: image, widget: image, required: false, hint: "1200 x 630 works best. Falls back to the featured image." }
